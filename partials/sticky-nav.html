<!-- STICKY NAV + MOBILE MENU -->
<style>
html{scroll-padding-top:112px}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.ce-head{z-index:50 !important;transition:background-color .35s ease,box-shadow .35s ease,padding .35s cubic-bezier(.4,0,.2,1),-webkit-backdrop-filter .35s ease,backdrop-filter .35s ease}
.ce-head img{transition:height .35s cubic-bezier(.4,0,.2,1)}
:is(.ce-hero,.ce-banner){box-sizing:border-box;padding-top:118px}
:is(.ce-hero,.ce-banner)>.ce-head{position:fixed !important;top:16px;left:16px;right:16px;box-sizing:border-box;border-radius:28px}
.ce-head-solid{position:sticky !important;top:16px}
.ce-head.is-stuck,.ce-head.is-open{background:rgba(4,23,26,.82) !important;-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 40px rgba(0,0,0,.28)}
.ce-head.is-stuck{padding-top:12px !important;padding-bottom:12px !important}
.ce-head.is-stuck img{height:52px !important}
.ce-burger{display:none;justify-self:start;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:transparent;color:#fff;cursor:pointer;transition:background-color .27s ease}
.ce-burger:hover{background:rgba(255,255,255,.14)}
.ce-burger:focus-visible,.ce-menu a:focus-visible{outline:2px solid #F9BE17;outline-offset:2px}
.ce-burger span{position:relative;display:block;width:18px;height:2px;border-radius:2px;background:currentColor;transition:background-color .2s ease}
.ce-burger span::before,.ce-burger span::after{content:"";position:absolute;left:0;width:18px;height:2px;border-radius:2px;background:currentColor;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.ce-burger span::before{top:-6px}.ce-burger span::after{top:6px}
.is-open .ce-burger span{background:transparent}
.is-open .ce-burger span::before{transform:translateY(6px) rotate(45deg)}
.is-open .ce-burger span::after{transform:translateY(-6px) rotate(-45deg)}
.ce-menu{position:absolute;top:calc(100% + 8px);left:0;right:0;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:24px;background:rgba(4,23,26,.96);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 18px 50px rgba(0,0,0,.35);opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .25s ease,transform .3s cubic-bezier(.4,0,.2,1),visibility 0s linear .3s}
.is-open .ce-menu{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.ce-menu a{display:flex;align-items:center;min-height:48px;padding:0 16px;border-radius:14px;color:#fff;font-size:16px;font-weight:600}
.ce-menu a:hover{background:rgba(255,255,255,.08);color:#F9BE17}
.ce-menu a[aria-current]{color:#E4D5BC}
.ce-menu a.ce-menu-cta{justify-content:center;margin-top:8px;background:#A7906E;color:#04171A;font-size:14px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.ce-menu a.ce-menu-cta:hover{background:#A7906E;color:#04171A;filter:brightness(1.06)}
@media (max-width:860px){
html{scroll-padding-top:92px}
.ce-burger{display:inline-flex}
.ce-head{gap:12px !important;padding:14px 16px !important}
.ce-head img{height:56px !important}
.ce-head.is-stuck{padding-top:10px !important;padding-bottom:10px !important}
.ce-head.is-stuck img{height:44px !important}
:is(.ce-hero,.ce-banner){padding-top:84px}
:is(.ce-hero,.ce-banner)>.ce-head{top:12px;left:12px;right:12px}
.ce-head-solid{top:12px}
.ce-head-solid{margin:12px !important}
}
@media (prefers-reduced-motion:reduce){.ce-head,.ce-head img,.ce-menu,.ce-burger span::before,.ce-burger span::after{transition:none}}
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
var head=document.querySelector('.ce-head');if(!head)return;
var ticking=false;
function update(){head.classList.toggle('is-stuck',window.scrollY>24);ticking=false}
window.addEventListener('scroll',function(){if(!ticking){ticking=true;requestAnimationFrame(update)}},{passive:true});
update();

var btn=document.createElement('button');
btn.type='button';btn.className='ce-burger';btn.setAttribute('aria-label','Menu');
btn.setAttribute('aria-expanded','false');btn.setAttribute('aria-controls','ce-menu');
btn.innerHTML='<span></span>';
var menu=document.createElement('div');menu.className='ce-menu';menu.id='ce-menu';
var seen={};
head.querySelectorAll('a[data-nav]').forEach(function(a){
var href=a.getAttribute('href');if(seen[href])return;seen[href]=1;
var l=document.createElement('a');l.href=href;l.textContent=a.textContent.trim();
if(a.hasAttribute('aria-current'))l.setAttribute('aria-current','page');
menu.appendChild(l)});
var cta=document.createElement('a');cta.href='quote.html';cta.className='ce-menu-cta';cta.textContent='Get a Free Quote';
menu.appendChild(cta);
head.insertBefore(btn,head.firstChild);head.appendChild(menu);

function set(open){head.classList.toggle('is-open',open);btn.setAttribute('aria-expanded',open)}
btn.addEventListener('click',function(){set(!head.classList.contains('is-open'))});
menu.addEventListener('click',function(e){if(e.target.closest('a'))set(false)});
document.addEventListener('click',function(e){if(!head.contains(e.target))set(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&head.classList.contains('is-open')){set(false);btn.focus()}});
window.matchMedia('(min-width:861px)').addEventListener('change',function(e){if(e.matches)set(false)});
});
</script>
